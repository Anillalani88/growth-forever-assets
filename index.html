<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growth Forever Inc. — Gmail Signature Generator</title>
<style>
:root{--navy:#0B1D33;--gold:#D4AF37;--muted:#657181;--line:#d8dde4}
*{box-sizing:border-box} body{margin:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:var(--navy)}
.wrap{max-width:1050px;margin:34px auto;padding:0 18px}.head{margin-bottom:22px}.head h1{margin:0 0 6px;font-size:27px}.head p{margin:0;color:#66717f}
.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.card{background:#fff;border:1px solid #e3e7eb;border-radius:14px;padding:22px;box-shadow:0 4px 18px rgba(11,29,51,.06)}
label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field{margin-bottom:15px}
input{width:100%;padding:11px 12px;border:1px solid #cfd5dc;border-radius:8px;font:14px Arial;outline:none}input:focus{border-color:var(--gold)}
.preview-title{font-size:12px;font-weight:700;color:#697583;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}
.preview-box{min-height:220px;display:flex;align-items:center;padding:22px;border:1px dashed #cbd2d9;border-radius:10px;background:#fff;overflow:auto}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--navy);color:#fff}.secondary{background:#eef1f4;color:var(--navy)}
#status{font-size:13px;margin-top:12px;min-height:18px;color:#287346}.note{font-size:12px;line-height:1.5;color:#697583;margin-top:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{margin-top:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Growth Forever Inc.</h1>
    <p>Gmail Signature Generator</p>
  </div>
  <div class="grid">
    <div class="card">
      <div class="field"><label for="sigName">NAME</label><input id="sigName" value="Nazim Kherani"></div>
      <div class="field"><label for="sigTitle">DESIGNATION</label><input id="sigTitle" value="Partner"></div>
      <div class="field"><label for="sigPhone">PHONE</label><input id="sigPhone" value="+1 XXX XXX XXXX"></div>
      <div class="field"><label for="sigEmail">EMAIL</label><input id="sigEmail" value="nazim@example.com"></div>
      <div class="field"><label for="sigWebsite">WEBSITE <span style="font-weight:400;color:#8a949f;">(OPTIONAL)</span></label><input id="sigWebsite" value="" placeholder="growthforever.ca"></div>
      <div class="actions">
        <button class="primary" onclick="copySignature()">Copy Signature</button>
        <button class="secondary" onclick="resetForm()">Reset</button>
      </div>
      <div id="status"></div>
      <div class="note">After copying: Gmail → Settings → See all settings → General → Signature → paste into the signature box.</div>
    </div>

    <div class="card">
      <div class="preview-title">Live preview</div>
      <div class="preview-box">
        <div id="signature"></div>
      </div>
    </div>
  </div>
</div>

<script>
const LOGO_URL="https://raw.githubusercontent.com/Anillalani88/growth-forever-assets/main/growth-forever-logo-white.png";
const defaults={name:"Nazim Kherani",title:"Partner",phone:"+1 XXX XXX XXXX",email:"nazim@example.com",website:""};
const ids=["sigName","sigTitle","sigPhone","sigEmail","sigWebsite"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function signatureHTML(){
 const n=esc(document.getElementById("sigName").value.trim()), t=esc(document.getElementById("sigTitle").value.trim()), p=esc(document.getElementById("sigPhone").value.trim()), e=esc(document.getElementById("sigEmail").value.trim()), wRaw=document.getElementById("sigWebsite").value.trim(), w=esc(wRaw);
 const phoneHref=p.replace(/[^\d+]/g,"");
 const websiteHref=wRaw ? (/^https?:\/\//i.test(wRaw) ? wRaw : "https://"+wRaw) : "";
 return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#0B1D33;">
 <tr>
  <td style="vertical-align:middle;padding:2px 20px 2px 0;">
   <img src="${LOGO_URL}" alt="Growth Forever Inc." width="165" style="display:block;width:165px;max-width:165px;height:auto;border:0;">
  </td>
  <td style="width:1px;background:#D4AF37;font-size:1px;line-height:1px;">&nbsp;</td>
  <td style="vertical-align:middle;padding:2px 0 2px 20px;">
   <div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:19px;font-weight:700;color:#0B1D33;letter-spacing:.2px;">${n}</div>
   <div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;font-weight:700;color:#D4AF37;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;">${t}</div>
   ${p?`<div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#485565;"><span style="font-weight:700;color:#0B1D33;">M</span>&nbsp;&nbsp;<a href="tel:${phoneHref}" style="color:#485565;text-decoration:none;">${p}</a></div>`:""}
   ${e?`<div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#485565;"><span style="font-weight:700;color:#0B1D33;">E</span>&nbsp;&nbsp;<a href="mailto:${e}" style="color:#485565;text-decoration:none;">${e}</a></div>`:""}
   ${w?`<div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#485565;"><span style="font-weight:700;color:#0B1D33;">W</span>&nbsp;&nbsp;<a href="${esc(websiteHref)}" style="color:#485565;text-decoration:none;">${w}</a></div>`:""}
  </td>
 </tr></table>`;
}
function render(){signature.innerHTML=signatureHTML();status.textContent="";}
ids.forEach(id=>document.getElementById(id).addEventListener("input",render));
async function copySignature(){
 const html=signatureHTML();
 const plain=[document.getElementById("sigName").value,document.getElementById("sigTitle").value,document.getElementById("sigPhone").value,document.getElementById("sigEmail").value,document.getElementById("sigWebsite").value].filter(Boolean).join("\n");
 try{
   if(navigator.clipboard && window.ClipboardItem){
     await navigator.clipboard.write([new ClipboardItem({
       "text/html":new Blob([html],{type:"text/html"}),
       "text/plain":new Blob([plain],{type:"text/plain"})
     })]);
   }else{
     const range=document.createRange(); range.selectNodeContents(signature);
     const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
     document.execCommand("copy"); sel.removeAllRanges();
   }
   status.textContent="Signature copied. Paste it into Gmail.";
 }catch(err){
   const range=document.createRange(); range.selectNodeContents(signature);
   const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
   try{document.execCommand("copy");status.textContent="Signature copied. Paste it into Gmail."}
   catch(e){status.textContent="Select the preview and copy it manually."}
   sel.removeAllRanges();
 }
}
function resetForm(){document.getElementById("sigName").value=defaults.name;document.getElementById("sigTitle").value=defaults.title;document.getElementById("sigPhone").value=defaults.phone;document.getElementById("sigEmail").value=defaults.email;document.getElementById("sigWebsite").value=defaults.website;render();}
render();
</script>
</body>
</html>
